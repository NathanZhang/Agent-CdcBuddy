x-runtime: &runtime
  image: agent-cdcbuddy:refactor
  restart: unless-stopped
  environment: &env
    NODE_ENV: production
    PORT: 3000
    DEPLOYMENT_TIER: ${DEPLOYMENT_TIER:-pilot}
    APP_BUSINESS_DB_PATH: /app/data/business.db
    SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:?Explicit LLM credential required}
    SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
    SILICONFLOW_MODEL: ${SILICONFLOW_MODEL:-Qwen/Qwen3.6-27B}
    SILICONFLOW_REASONING_EFFORT: ${SILICONFLOW_REASONING_EFFORT:-medium}
  volumes: &volumes
    - ${BUSINESS_DATA_DIR:-./data}:/app/data
    - ${VECTOR_DATASET_PATH:-./vector_monitoring.db}:/app/vector_monitoring.db:ro
    - ${FOODBORNE_DATASET_PATH:-./foodborne_monitoring.db}:/app/foodborne_monitoring.db:ro
    - ${ENV_DATASET_PATH:-./env_monitoring.db}:/app/env_monitoring.db:ro
    - ${CHRONIC_DATASET_PATH:-./chronic_monitoring.db}:/app/chronic_monitoring.db:ro
services:
  vector-agent:
    <<: *runtime
    build: .
    environment:
      <<: *env
      AGENT_DOMAIN: vector
      APP_ORIGIN: ${VECTOR_ORIGIN:-http://localhost:3001}
    ports: ["${VECTOR_PORT:-3001}:3000"]
  foodborne-agent:
    <<: *runtime
    environment:
      <<: *env
      AGENT_DOMAIN: foodborne
      APP_ORIGIN: ${FOODBORNE_ORIGIN:-http://localhost:3002}
    ports: ["${FOODBORNE_PORT:-3002}:3000"]
  env-agent:
    <<: *runtime
    environment:
      <<: *env
      AGENT_DOMAIN: env
      APP_ORIGIN: ${ENV_ORIGIN:-http://localhost:3003}
    ports: ["${ENV_PORT:-3003}:3000"]
  chronic-agent:
    <<: *runtime
    environment:
      <<: *env
      AGENT_DOMAIN: chronic
      APP_ORIGIN: ${CHRONIC_ORIGIN:-http://localhost:3004}
    ports: ["${CHRONIC_PORT:-3004}:3000"]
  worker:
    <<: *runtime
    healthcheck:
      disable: true
    environment:
      <<: *env
      CDC_PROCESS: worker
      AGENT_DOMAIN: vector
